<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manuel · Jobs & Leads</title>
<style>
:root{--bg:#f3f2ef;--card:#fff;--blue:#0a66c2;--blue-dk:#004182;--text:rgba(0,0,0,.9);--muted:rgba(0,0,0,.6);--line:#e0dfdc;--green:#057642}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:760px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:12px;height:56px}
.logo{width:34px;height:34px;border-radius:6px;background:var(--blue);color:#fff;font-weight:700;display:grid;place-items:center;font-size:17px}
.who{font-weight:600;font-size:16px;flex:1}
.tabs{display:flex;gap:4px;height:100%}
.tab{background:none;border:0;font:inherit;color:var(--muted);padding:0 12px;border-bottom:2px solid transparent;cursor:pointer;height:100%;font-weight:600}
.tab.on{color:var(--text);border-bottom-color:var(--text)}
main{max-width:760px;margin:0 auto;padding:16px}
.search{width:100%;padding:10px 14px;border:1px solid #c7c7c7;border-radius:24px;font:inherit;background:#fff;outline:none}
.search:focus{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.note{color:var(--muted);font-size:13px;margin:10px 4px 0}
h2{font-size:16px;margin:24px 4px 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-weight:400;color:var(--muted);font-size:13px}
.card{background:var(--card);border-radius:10px;border:1px solid var(--line);padding:16px;margin-bottom:10px;display:flex;gap:12px}
.av{flex:0 0 48px;height:48px;border-radius:6px;background:#eef3f8;color:var(--blue);display:grid;place-items:center;font-weight:700;overflow:hidden}
.av img{width:100%;height:100%;object-fit:contain}
.av.round{border-radius:50%}
.body{flex:1;min-width:0}
.t{font-weight:600;font-size:16px;color:var(--text);text-decoration:none;display:block}
.sub{color:var(--muted);font-size:14px}
.sal{font-size:14px;margin-top:4px}
.est{font-size:12px;color:var(--muted)}
.why{font-size:14px;margin-top:6px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pct{flex:0 0 auto;font-weight:700;font-size:14px;padding:2px 10px;border-radius:12px;background:#e8f3ec;color:var(--green)}
.pct.mid{background:#eef3f8;color:var(--blue)}.pct.low{background:#f3f2ef;color:var(--muted)}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-block;border-radius:18px;padding:6px 16px;font-weight:600;font-size:14px;text-decoration:none;border:1px solid var(--blue);color:var(--blue);background:#fff;cursor:pointer;font-family:inherit}
.btn.fill{background:var(--blue);color:#fff}
.btn.fill:hover{background:var(--blue-dk)}
.btn.gray{border-color:#8c8c8c;color:var(--muted)}
.link{color:var(--blue);font-weight:600;font-size:14px;background:none;border:0;cursor:pointer;padding:6px 4px;font-family:inherit}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:#f3f2ef;color:var(--muted);margin-left:6px;font-weight:600;vertical-align:1px}
.rel{font-size:13px;color:var(--muted);margin-top:4px}
.seats{display:block;padding:0 16px}.seatrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);color:var(--text);text-decoration:none;font-size:14px}.seatrow:last-child{border-bottom:0}.go{color:var(--blue);font-weight:600;white-space:nowrap}
.more{display:block;margin:16px auto;text-align:center}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1d2226;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:480px){.who{font-size:15px}.bar{padding:0 12px}.tab{padding:0 10px}main{padding:12px}.card{padding:14px}.av{flex-basis:40px;height:40px}}
</style>
</head>
<body>
<header><div class="bar"><div class="logo">M</div><div class="who">Manuel's board</div>
<nav class="tabs"><button class="tab on" data-tab="jobs">Jobs</button><button class="tab" data-tab="leads">Leads</button></nav></div></header>
<main>
  <input id="q" class="search" type="search" placeholder="Search jobs or companies" autocomplete="off">
  <div id="list"></div>
</main>
<div id="toast" class="toast"></div>
<script>
const S={tab:'jobs',q:'',long:false,jobs:[],leads:[],meta:{}};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const k=n=>'$'+Math.round(n/1000)+'k';
const BANDS=[['75-100','Strong odds','75–100%'],['50-75','Good odds','50–75%'],['25-50','Stretch','25–50%']];
function initials(s){return s.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()}
function av(logo,name,round){return `<div class="av${round?' round':''}">${logo?`<img src="${esc(logo)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(initials(name))}'))">`:esc(initials(name))}</div>`}
function match(o){if(S.tab==='leads'&&S.co)return o.company===S.co;if(!S.q)return true;const q=S.q.toLowerCase();return Object.values(o).join(' ').toLowerCase().includes(q)}
function jobCard(j){
  const cls=j.prob>=75?'':j.prob>=50?'mid':'low';
  const sal=j.salary_type==='posted'?`${j.salary_low?k(j.salary_low)+'–':''}${k(j.salary_high)} <span class="est">posted</span>`
    :`${k(j.salary_low)}–${k(j.salary_high)} <span class="tag">est.</span><div class="est">${esc(j.salary_basis)}</div>`;
  return `<div class="card">${av(j.logo,j.company)}<div class="body">
  <div class="top"><a class="t" href="${j.link}" target="_blank" rel="noopener">${esc(j.title)}</a><span class="pct ${cls}">${j.prob}%</span></div>
  <div class="sub">${esc(j.company)} · ${esc(j.location)}</div>
  <div class="sal">${sal}</div>
  <div class="why">${esc(j.why)}</div>
  <div class="acts"><a class="btn fill" href="${j.link}" target="_blank" rel="noopener">Apply on LinkedIn</a>
  <button class="link" onclick="seeLeads('${esc(j.company)}')">See leads →</button></div></div></div>`}
function renderJobs(){
  const js=S.jobs.filter(match); let h='';
  for(const [b,name,range] of BANDS){const g=js.filter(j=>j.band===b); if(!g.length)continue;
    h+=`<h2>${name} · ${range}<small>${g.length} jobs</small></h2>`+g.map(jobCard).join('')}
  const ls=js.filter(j=>j.band==='<25');
  if(ls.length){ if(S.long) h+=`<h2>Long shots · under 25%<small>${ls.length}</small></h2>`+ls.map(jobCard).join('');
    else h+=`<button class="link more" onclick="S.long=true;render()">Show ${ls.length} long shots</button>`}
  if(!h) h='<div class="empty">No jobs match.</div>';
  h+=`<p class="note">All roles $280k+ (posted pay or estimated total comp). Updated ${esc(S.meta.generated||'')}.</p>`;
  $('#list').innerHTML=h}
function leadCard(p){
  if(p.seat) return `<div class="card seat">${av('','?',true)}<div class="body"><div class="t">Find a recruiter at ${esc(p.company)}</div>
  <div class="sub">No named contact yet — opens a LinkedIn people search</div><div class="rel">For: ${esc(p.jobs_label)}</div>
  <div class="acts"><a class="btn" href="${p.linkedin_url}" target="_blank" rel="noopener">Search on LinkedIn</a></div></div></div>`;
  return `<div class="card">${av('',p.name,true)}<div class="body">
  <div class="t">${esc(p.name)}<span class="tag">${esc(p.kind)}</span></div>
  <div class="sub">${esc(p.title)} · ${esc(p.company)}</div>
  <div class="rel">For: ${esc(p.jobs_label)}</div>
  <div class="acts"><a class="btn" href="${p.linkedin_url}" target="_blank" rel="noopener">Open LinkedIn</a>
  <button class="btn gray" onclick="copyNote(${S.leads.indexOf(p)})">Copy note</button></div></div></div>`}
function renderLeads(){
  const ls=S.leads.filter(match), named=ls.filter(p=>!p.seat), seats=ls.filter(p=>p.seat), order=[];
  for(const p of named){ if(!order.includes(p.company)) order.push(p.company) }
  let h='';
  for(const c of order){const g=named.filter(p=>p.company===c);
    h+=`<h2>${esc(c)}<small>best job ${g[0].best_prob}%</small></h2>`+g.map(leadCard).join('')}
  if(seats.length) h+=`<h2>No names yet · search LinkedIn<small>${seats.length} companies</small></h2><div class="card seats">`+seats.map(p=>
    `<a class="seatrow" href="${p.linkedin_url}" target="_blank" rel="noopener"><span><b>Find a recruiter at ${esc(p.company)}</b><br><span class="rel">For: ${esc(p.jobs_label)}</span></span><span class="go">Search →</span></a>`).join('')+'</div>';
  $('#list').innerHTML=h||'<div class="empty">No leads match.</div>'}
function render(){S.tab==='jobs'?renderJobs():renderLeads()}
function setTab(t,q=''){S.tab=t;S.co='';S.q=q;$('#q').value=q;$('#q').placeholder=t==='jobs'?'Search jobs or companies':'Search people or companies';
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));render();scrollTo(0,0)}
function seeLeads(c){setTab('leads',c);S.co=c;render()}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function copyNote(i){const n=S.leads[i].note;
  (navigator.clipboard?navigator.clipboard.writeText(n):Promise.reject()).then(()=>toast('Note copied'))
  .catch(()=>{const a=document.createElement('textarea');a.value=n;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('Note copied')})}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$('#q').oninput=e=>{S.q=e.target.value.trim();S.co='';render()};
Promise.all([fetch('data/jobs.json',{cache:'no-cache'}).then(r=>r.json()),fetch('data/leads.json',{cache:'no-cache'}).then(r=>r.json())]).then(([j,l])=>{
  S.jobs=j.jobs;S.meta=j.meta;S.leads=l.leads;location.hash==='#leads'?setTab('leads'):render()});
</script>
</body>
</html>
